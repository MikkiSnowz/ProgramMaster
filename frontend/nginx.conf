# frontend/nginx.conf

server {
    listen 80;
    server_name localhost;

    # 🟢 💡 FIXED: สั่งปิด Absolute Redirect และพอร์ตจำลองภายในตู้คอนเทนเนอร์ เพื่อล็อกพอร์ต 8085 บนบราวเซอร์เครื่อง Host ให้คงอยู่ถาวร
    absolute_redirect off;
    port_in_redirect off;

    # 💻 1. ROUTE WEB TRAFFIC: เสิร์ฟไฟล์หน้าบ้าน Astro Static HTML
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 🌐 2. PROXY API TRAFFIC: Intercept และส่งต่อ /api ไปที่ Express
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
