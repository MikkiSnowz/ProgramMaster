services:
  postgres-db:
    image: postgres:15-alpine
    container_name: tutormatch_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 15

  # Creates the schema and seeds demo data on first boot (backend/src/sql.ts).
  backend:
    build: ./backend
    container_name: tutormatch_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:5000" # exposed for `astro dev`, which proxies /api here
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres-db:
        condition: service_healthy

  # Static Astro build served by nginx, which also proxies /api to the backend.
  frontend:
    build: ./frontend
    container_name: tutormatch_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  pgdata:
